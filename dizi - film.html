<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Tracker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    transition: background 0.3s;
}

body.dark-mode {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
}

.container {
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    transition: background 0.3s, color 0.3s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

body.dark-mode .container {
    background: #0f3460;
    color: #e0e0e0;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    border-bottom: 3px solid #667eea;
    padding-bottom: 20px;
}

header h1 {
    margin: 0;
    font-size: 2.5em;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.controls {
    display: flex;
    gap: 10px;
}

.controls button,
.controls select {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #667eea;
    color: white;
    font-weight: bold;
    transition: all 0.3s;
}

.controls button:hover,
.controls select:hover {
    background: #764ba2;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.search-box {
    width: 100%;
    padding: 15px;
    margin: 20px 0;
    border: 2px solid #667eea;
    border-radius: 10px;
    font-size: 1em;
    transition: all 0.3s;
}

body.dark-mode .search-box {
    background: #1a2744;
    border-color: #667eea;
    color: #e0e0e0;
}

.search-box:focus {
    outline: none;
    border-color: #764ba2;
    box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
}

.form-group {
    display: grid;
    grid-template-columns: 2fr 1fr 1.5fr 1fr 0.8fr auto;
    gap: 12px;
    margin: 25px 0;
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    transition: background 0.3s;
}

body.dark-mode .form-group {
    background: #1a2744;
}

input, select {
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
    transition: all 0.3s;
}

body.dark-mode input,
body.dark-mode select {
    background: #0f3460;
    color: #e0e0e0;
    border-color: #2a3f5f;
}

input:focus, select:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
}

.add-btn {
    padding: 12px 25px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1em;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.add-btn:active {
    transform: translateY(0);
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 40px;
    margin-bottom: 15px;
    gap: 15px;
}

h2 {
    color: #333;
    transition: color 0.3s;
    font-size: 1.8em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
}

body.dark-mode h2 {
    color: #e0e0e0;
}

.filter-section {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 6px 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 500;
    font-size: 0.8em;
}

.filter-btn.active {
    background: linear-gradient(135deg, #764ba2, #667eea);
    box-shadow: 0 0 12px rgba(102, 126, 234, 0.5);
    transform: scale(1.05);
}

.filter-btn:hover {
    background: #764ba2;
    transform: translateY(-1px);
}

.media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}

.media-card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.3s;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    padding: 15px;
}

body.dark-mode .media-card {
    background: #1a2744;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.media-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(102, 126, 234, 0.15);
}

.media-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 8px;
}

.media-card h3 {
    margin: 0;
    color: #333;
    transition: color 0.3s;
    font-size: 1.1em;
    line-height: 1.2;
    flex: 1;
}

body.dark-mode .media-card h3 {
    color: #e0e0e0;
}

.media-tags {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
    min-width: max-content;
}

.badge {
    display: inline-block;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 4px 10px;
    border-radius: 15px;
    font-size: 0.7em;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(102, 126, 234, 0.25);
    white-space: nowrap;
}

.media-info {
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.rating {
    margin: 10px 0;
    font-size: 22px;
    display: flex;
    gap: 3px;
}

.rating span {
    cursor: pointer;
    transition: all 0.2s;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.1));
}

.rating span:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 2px 4px rgba(255, 193, 7, 0.3));
}

.rating-display {
    font-size: 0.85em;
    margin: 8px 0;
    color: #666;
    transition: color 0.3s;
    font-weight: 600;
}

body.dark-mode .rating-display {
    color: #a0a0a0;
}

.media-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid #e9ecef;
}

body.dark-mode .media-actions {
    border-top-color: #2a3f5f;
}

button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 600;
    font-size: 0.85em;
}

.action-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.25);
}

.action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
}

.delete-btn {
    background: linear-gradient(135deg, #dc3545, #c82333);
    color: white;
    box-shadow: 0 2px 8px rgba(220, 53, 69, 0.25);
}

.delete-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
}

.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #999;
    font-size: 1.1em;
    grid-column: 1 / -1;
}

.empty-state-icon {
    font-size: 2.5em;
    margin-bottom: 10px;
    opacity: 0.5;
}

@media (max-width: 768px) {
    .form-group {
        grid-template-columns: 1fr 1fr;
    }

    header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }

    header h1 {
        font-size: 2em;
    }

    .media-grid {
        grid-template-columns: 1fr;
    }

    h2 {
        font-size: 1.5em;
    }

    .section-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .media-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .media-tags {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1 data-i18n="title">🎬 Media Tracker</h1>
    <div class="controls">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
        </select>
        <button onclick="toggleDarkMode()">🌙</button>
    </div>
</header>

<!-- Search -->
<input type="text" class="search-box" id="searchInput" placeholder="🔍 Ara..." data-i18n="searchPlaceholder" onkeyup="render()">

<!-- Add Form -->
<div class="form-group">
    <input id="title" placeholder="Başlık" data-i18n="titlePlaceholder">
    <select id="type">
        <option value="Series">Dizi</option>
        <option value="Movie">Film</option>
    </select>
    <select id="genre">
        <option value="Action">Aksiyon</option>
        <option value="Comedy">Komedi</option>
        <option value="Romance">Romantik</option>
        <option value="Drama">Drama</option>
        <option value="Horror">Korku</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Thriller">Gerilim</option>
        <option value="Animation">Animasyon</option>
    </select>
    <input id="year" placeholder="Yıl" data-i18n="yearPlaceholder">
    <input id="seasons" placeholder="Sezon" data-i18n="seasonsPlaceholder" type="number" min="1">
    <button class="add-btn" onclick="addMedia()" data-i18n="add">Ekle</button>
</div>

<!-- Watch Later -->
<div class="section-header">
    <h2 data-i18n="watchLater">📋 İzlenecek</h2>
    <div class="filter-section" id="watchLaterFilters"></div>
</div>
<div class="media-grid" id="watchList"></div>

<!-- Watched -->
<div class="section-header">
    <h2 data-i18n="watched">✅ İzlenen</h2>
    <div class="filter-section" id="watchedFilters"></div>
</div>
<div class="media-grid" id="watchedList"></div>

</div>

<script>

const translations = {
    tr: {
        title: '🎬 Medya Takipçisi',
        searchPlaceholder: '🔍 Ara...',
        titlePlaceholder: 'Başlık',
        yearPlaceholder: 'Yıl',
        seasonsPlaceholder: 'Sezon (dizi için)',
        add: 'Ekle',
        watchLater: '📋 İzlenecek',
        watched: '✅ İzlenen',
        all: 'Tümü',
        action: 'Aksiyon',
        comedy: 'Komedi',
        romance: 'Romantik',
        drama: 'Drama',
        horror: 'Korku',
        scifi: 'Sci-Fi',
        thriller: 'Gerilim',
        animation: 'Animasyon',
        series: 'Dizi',
        movie: 'Film',
        type: 'Tür',
        genre: 'Kategori',
        year: 'Yıl',
        seasons: 'Sezon',
        marked: 'İzlendi',
        delete: 'Sil',
        confirmDelete: 'Silinsin mi?',
        rating: 'Puan',
        noItems: 'Öğe yok',
        filter: 'Filtrele'
    },
    en: {
        title: '🎬 Media Tracker',
        searchPlaceholder: '🔍 Search...',
        titlePlaceholder: 'Title',
        yearPlaceholder: 'Year',
        seasonsPlaceholder: 'Seasons (for series)',
        add: 'Add',
        watchLater: '📋 Watch Later',
        watched: '✅ Watched',
        all: 'All',
        action: 'Action',
        comedy: 'Comedy',
        romance: 'Romance',
        drama: 'Drama',
        horror: 'Horror',
        scifi: 'Sci-Fi',
        thriller: 'Thriller',
        animation: 'Animation',
        series: 'Series',
        movie: 'Movie',
        type: 'Type',
        genre: 'Genre',
        year: 'Year',
        seasons: 'Seasons',
        marked: 'Marked',
        delete: 'Delete',
        confirmDelete: 'Delete this?',
        rating: 'Rating',
        noItems: 'No items',
        filter: 'Filter'
    }
};

let currentLanguage = 'tr';
let currentWatchLaterFilter = 'all';
let currentWatchedFilter = 'all';

let mediaData = {
    watchLater: [],
    watched: []
};

// Load
function loadData() {
    const saved = localStorage.getItem('mediaData');
    if (saved) mediaData = JSON.parse(saved);
    const lang = localStorage.getItem('language');
    if (lang) currentLanguage = lang;
    const dark = localStorage.getItem('darkMode');
    if (dark === 'true') document.body.classList.add('dark-mode');
    document.getElementById('languageSelect').value = currentLanguage;
    updateTranslations();
    render();
}

// Save
function saveData() {
    localStorage.setItem('mediaData', JSON.stringify(mediaData));
}

// Dark Mode
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
}

// Language
function changeLanguage(lang) {
    currentLanguage = lang;
    localStorage.setItem('language', lang);
    updateTranslations();
    render();
}

// Update translations
function updateTranslations() {
    const trans = translations[currentLanguage];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (el.tagName === 'INPUT' || el.tagName === 'SELECT') {
            el.placeholder = trans[key];
        } else {
            el.textContent = trans[key];
        }
    });

    const typeSelect = document.getElementById('type');
    typeSelect.innerHTML = `
        <option value="Series">${trans.series}</option>
        <option value="Movie">${trans.movie}</option>
    `;

    const genreSelect = document.getElementById('genre');
    const genres = ['Action', 'Comedy', 'Romance', 'Drama', 'Horror', 'Sci-Fi', 'Thriller', 'Animation'];
    genreSelect.innerHTML = genres.map(g => `<option value="${g}">${trans[g.toLowerCase().replace('-', '')]}</option>`).join('');
}

// Get trans
function t(key) {
    return translations[currentLanguage][key];
}

// Add
function addMedia() {
    const title = document.getElementById('title').value.trim();
    if (!title) return alert(t('add'));

    const type = document.getElementById('type').value;
    const seasons = document.getElementById('seasons').value;

    mediaData.watchLater.push({
        id: Date.now(),
        title,
        type,
        genre: document.getElementById('genre').value,
        year: document.getElementById('year').value || 'N/A',
        seasons: type === 'Series' ? (seasons || '0') : null
    });

    document.getElementById('title').value = '';
    document.getElementById('year').value = '';
    document.getElementById('seasons').value = '';
    saveData();
    render();
}

// Mark watched
function markWatched(id) {
    const i = mediaData.watchLater.findIndex(x => x.id === id);
    if (i !== -1) {
        mediaData.watched.push({
            ...mediaData.watchLater[i],
            rating: 0
        });
        mediaData.watchLater.splice(i, 1);
        saveData();
        render();
    }
}

// Delete
function removeItem(id, list) {
    if (!confirm(t('confirmDelete'))) return;
    mediaData[list] = mediaData[list].filter(x => x.id !== id);
    saveData();
    render();
}

// Rate
function rateMovie(id, rating) {
    const m = mediaData.watched.find(x => x.id === id);
    if (m) {
        m.rating = rating;
        saveData();
        render();
    }
}

// Filter
function setFilter(list, genre) {
    if (list === 'watchLater') {
        currentWatchLaterFilter = genre;
    } else {
        currentWatchedFilter = genre;
    }
    render();
}

// Get filtered data
function getFiltered(list, filterType) {
    let filter = filterType === 'watchLater' ? currentWatchLaterFilter : currentWatchedFilter;
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    let filtered = mediaData[list];
    
    if (filter !== 'all') {
        filtered = filtered.filter(m => m.genre === filter);
    }
    
    if (search) {
        filtered = filtered.filter(m => 
            m.title.toLowerCase().includes(search) ||
            m.genre.toLowerCase().includes(search)
        );
    }
    
    return filtered;
}

// Get unique genres
function getGenres(list) {
    const genres = new Set(mediaData[list].map(m => m.genre));
    return ['all', ...genres];
}

// Render
function render() {
    const trans = translations[currentLanguage];
    
    // Watch Later Filters
    const wlGenres = getGenres('watchLater');
    document.getElementById('watchLaterFilters').innerHTML = 
        wlGenres.map(g => `
            <button class="filter-btn ${currentWatchLaterFilter === g ? 'active' : ''}" 
                    onclick="setFilter('watchLater', '${g}')">${g === 'all' ? trans.all : trans[g.toLowerCase().replace('-', '')]}</button>
        `).join('');

    // Watched Filters
    const wGenres = getGenres('watched');
    document.getElementById('watchedFilters').innerHTML = 
        wGenres.map(g => `
            <button class="filter-btn ${currentWatchedFilter === g ? 'active' : ''}" 
                    onclick="setFilter('watched', '${g}')">${g === 'all' ? trans.all : trans[g.toLowerCase().replace('-', '')]}</button>
        `).join('');

    // Watch List
    const watchFiltered = getFiltered('watchLater', 'watchLater');
    document.getElementById('watchList').innerHTML = watchFiltered.length ? 
        watchFiltered.map(m => `
            <div class="media-card">
                <div class="media-header">
                    <h3>${m.title}</h3>
                    <div class="media-tags">
                        <span class="badge">${trans[m.type.toLowerCase()]}</span>
                        <span class="badge">${m.genre}</span>
                        ${m.seasons ? `<span class="badge">📺 ${m.seasons}</span>` : `<span class="badge">${m.year}</span>`}
                    </div>
                </div>
                <div class="media-actions">
                    <button class="action-btn" onclick="markWatched(${m.id})">${trans.marked}</button>
                    <button class="delete-btn" onclick="removeItem(${m.id}, 'watchLater')">${trans.delete}</button>
                </div>
            </div>
        `).join('') : `<div class="empty-state"><div class="empty-state-icon">📭</div>${trans.noItems}</div>`;

    // Watched List
    const watchedFiltered = getFiltered('watched', 'watched');
    document.getElementById('watchedList').innerHTML = watchedFiltered.length ?
        watchedFiltered.map(m => `
            <div class="media-card">
                <div class="media-header">
                    <h3>${m.title}</h3>
                    <div class="media-tags">
                        <span class="badge">${trans[m.type.toLowerCase()]}</span>
                        <span class="badge">${m.genre}</span>
                        ${m.seasons ? `<span class="badge">📺 ${m.seasons}</span>` : `<span class="badge">${m.year}</span>`}
                    </div>
                </div>
                <div class="rating">
                    ${[1,2,3,4,5].map(i => `<span onclick="rateMovie(${m.id}, ${i})" style="color: ${m.rating >= i ? '#ffc107' : '#ccc'}; cursor: pointer;">★</span>`).join('')}
                </div>
                <div class="rating-display">⭐ ${m.rating || 0}/5</div>
                <div class="media-actions">
                    <button class="delete-btn" onclick="removeItem(${m.id}, 'watched')">${trans.delete}</button>
                </div>
            </div>
        `).join('') : `<div class="empty-state"><div class="empty-state-icon">🎯</div>${trans.noItems}</div>`;
}

// Initialize
loadData();

</script>

</body>
</html>
